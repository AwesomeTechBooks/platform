# Reusable workflow: build one book with the shared platform and publish it to GitHub Pages.
#
# A book repository calls it from .github/workflows/pages.yml:
#
#   jobs:
#     book:
#       uses: AwesomeTechBooks/platform/.github/workflows/book.yml@v1
#       with:              # optional
#         prebuilt: html   # publish this directory as is instead of running mdBook
#
# The caller grants the permissions (contents: read, pages: write, id-token: write)
# and its repository must have Settings → Pages → Source set to "GitHub Actions".
name: Book

on:
  workflow_call:
    inputs:
      prebuilt:
        description: Directory of ready-made HTML to publish instead of running mdBook
        type: string
        default: ""
      platform-ref:
        description: Platform version to build with; keep it in step with the @ref in "uses"
        type: string
        default: v1
      mdbook-version:
        description: mdBook release used for every book
        type: string
        default: 0.5.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: book
      - uses: actions/checkout@v7
        with:
          repository: AwesomeTechBooks/platform
          ref: ${{ inputs.platform-ref }}
          path: platform
      - name: Install mdBook
        if: inputs.prebuilt == ''
        env:
          MDBOOK_VERSION: ${{ inputs.mdbook-version }}
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build
        env:
          PREBUILT: ${{ inputs.prebuilt }}
        run: bash platform/tools/build-book.sh book _site ${PREBUILT:+--prebuilt "$PREBUILT"}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
